<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaceClimate — Running Forecast</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
  <style>
    @keyframes fadeInUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes slideDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    .animate-fade-in-up { animation: fadeInUp 0.4s ease-out both; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out both; }
    .animate-slide-down { animation: slideDown 0.3s ease-out both; }
    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }
    .delay-3 { animation-delay: 0.15s; }
    .delay-4 { animation-delay: 0.2s; }
    .delay-5 { animation-delay: 0.25s; }
    .delay-6 { animation-delay: 0.3s; }
    .delay-7 { animation-delay: 0.35s; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 2px; }
    .score-ring { transition: stroke-dashoffset 0.8s ease-out; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased">
  <div class="max-w-4xl mx-auto px-4 py-6">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="flex flex-col items-center justify-center min-h-[80vh] animate-fade-in">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-emerald-700 mb-4 shadow-lg shadow-emerald-900/30">
          <span class="text-3xl font-bold text-white">P</span>
        </div>
        <h1 class="text-4xl font-bold text-white mb-1">PaceClimate</h1>
        <p class="text-gray-400 text-sm">Smart running weather forecasts</p>
      </div>

      <div class="bg-gradient-to-b from-gray-900 to-gray-900/95 rounded-2xl border border-gray-700/50 p-7 w-full max-w-sm shadow-xl shadow-black/20">
        <div id="g_id_onload"
             data-client_id="{{ google_client_id }}"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="onGoogleSignIn"
             data-auto_prompt="false">
        </div>

        <p class="text-xs text-gray-500 mb-3 text-center font-medium uppercase tracking-wider">Sign in with</p>

        <div id="google-btn-wrap" class="flex justify-center mb-5 min-h-[40px]">
          <div class="g_id_signin"
               data-type="standard"
               data-shape="pill"
               data-theme="outline"
               data-size="large"
               data-text="signin_with"
               data-logo_alignment="left">
          </div>
        </div>

        <div class="relative mb-5">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-700/50"></div></div>
          <div class="relative flex justify-center"><span class="bg-gray-900 px-3 text-xs text-gray-500">or email</span></div>
        </div>

        <div class="flex mb-4 bg-gray-800/50 rounded-xl p-1 border border-gray-700/30">
          <button id="tab-login" class="flex-1 py-2 text-sm font-medium rounded-lg bg-emerald-600 text-white transition-all duration-200">Sign In</button>
          <button id="tab-register" class="flex-1 py-2 text-sm font-medium rounded-lg text-gray-400 hover:text-white transition-all duration-200">Register</button>
        </div>

        <input type="email" id="auth-email" class="w-full bg-gray-800/50 rounded-xl px-4 py-3 text-sm border border-gray-700/50 mb-3 focus:outline-none focus:border-emerald-500/50 transition placeholder:text-gray-600" placeholder="Email address">
        <input type="password" id="auth-password" class="w-full bg-gray-800/50 rounded-xl px-4 py-3 text-sm border border-gray-700/50 mb-3 focus:outline-none focus:border-emerald-500/50 transition placeholder:text-gray-600" placeholder="Password">
        <input type="password" id="auth-confirm" class="w-full bg-gray-800/50 rounded-xl px-4 py-3 text-sm border border-gray-700/50 mb-3 focus:outline-none focus:border-emerald-500/50 transition placeholder:text-gray-600 hidden" placeholder="Confirm password">
        <button id="auth-btn" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 rounded-xl text-sm font-semibold transition-all duration-200 active:scale-[0.98]">Sign In</button>
        <p id="auth-error" class="mt-3 text-sm text-red-400 hidden text-center"></p>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden animate-fade-in">

      <!-- Header (compact) -->
      <header class="mb-4">
        <div class="flex items-center justify-between bg-gray-900/60 rounded-xl border border-gray-800/50 px-4 py-3">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-500 to-emerald-700 flex items-center justify-center text-xs font-bold shadow-lg shadow-emerald-900/20" id="user-avatar">R</div>
            <div>
              <h1 class="text-base font-semibold text-white leading-tight">PaceClimate</h1>
              <p class="text-[11px] text-gray-400"><span id="city-display">{{ default_city }}</span></p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span id="user-email" class="text-[11px] text-gray-500 hidden sm:inline"></span>
            <button id="logout-btn" class="text-[11px] text-gray-500 hover:text-red-400 transition px-2 py-1 rounded-lg hover:bg-gray-800">Logout</button>
          </div>
        </div>
        <div id="stats-bar" class="mt-2 text-xs text-gray-500 text-center"></div>
      </header>

      <!-- Controls row -->
      <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
        <div class="flex bg-gray-900/60 rounded-lg p-0.5 border border-gray-800/30">
          <button class="time-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-200" data-pref="morning">🌅 AM</button>
          <button class="time-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-200" data-pref="afternoon">☀️ PM</button>
          <button class="time-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-200 bg-emerald-600 text-white shadow-sm" data-pref="evening">🌙 Eve</button>
        </div>
        <div class="flex gap-1.5">
          <button id="log-run-toggle" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-gradient-to-r from-emerald-700 to-emerald-600 hover:from-emerald-600 hover:to-emerald-500 transition-all duration-200 active:scale-[0.97] shadow-lg shadow-emerald-900/20 flex items-center gap-1">+ Run</button>
          <button id="history-toggle" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-gray-800 hover:bg-gray-700 border border-gray-700/50 transition-all duration-200 active:scale-[0.97]">📋 Log</button>
        </div>
      </div>

      <!-- Main area: forecast left, chat right -->
      <div class="flex flex-col lg:flex-row gap-4">

        <!-- LEFT COLUMN: forecast + forms -->
        <div class="flex-1 min-w-0 space-y-4">

          <!-- Effort Plan -->
          <div id="effort-bar" class="bg-gray-900/60 rounded-xl border border-gray-800/30 p-4 hidden animate-slide-down">
            <div class="flex items-center gap-2 mb-3">
              <span class="text-base">🎯</span>
              <h3 class="text-xs font-semibold text-gray-200">Plan Effort</h3>
            </div>
            <div class="flex flex-wrap gap-2 items-end">
              <div><label class="text-[10px] text-gray-500 mb-0.5 block">Dist (km)</label><input type="number" id="plan-dist" step="0.1" class="w-20 bg-gray-800/80 rounded-lg px-2.5 py-1.5 text-xs border border-gray-700/50 focus:outline-none focus:border-emerald-500/50 transition placeholder:text-gray-600" placeholder="0"></div>
              <div><label class="text-[10px] text-gray-500 mb-0.5 block">Dur (min)</label><input type="number" id="plan-dur" class="w-20 bg-gray-800/80 rounded-lg px-2.5 py-1.5 text-xs border border-gray-700/50 focus:outline-none focus:border-emerald-500/50 transition placeholder:text-gray-600" placeholder="0"></div>
              <div><label class="text-[10px] text-gray-500 mb-0.5 block">Pace</label><input type="number" id="plan-pace" step="0.1" class="w-20 bg-gray-800/80 rounded-lg px-2.5 py-1.5 text-xs border border-gray-700/50 focus:outline-none focus:border-emerald-500/50 transition" readonly></div>
              <button id="plan-update" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 rounded-lg text-xs transition-all duration-200">Set</button>
              <button id="plan-reset" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs transition-all duration-200">Reset</button>
            </div>
          </div>

          <!-- Log Run Form -->
          <div id="log-run-form" class="hidden bg-gray-900/60 rounded-xl border border-gray-800/30 p-4 animate-slide-down">
            <div class="flex items-center gap-2 mb-3">
              <span class="text-base">🏃</span>
              <h3 class="text-xs font-semibold text-gray-200">Log Run</h3>
            </div>
            <div class="flex gap-1.5 mb-3 flex-wrap">
              <button class="quick-dist px-2.5 py-1 rounded-lg text-[10px] font-medium bg-gray-800 hover:bg-gray-700 border border-gray-700/50 transition-all duration-200" data-val="3">3K</button>
              <button class="quick-dist px-2.5 py-1 rounded-lg text-[10px] font-medium bg-gray-800 hover:bg-gray-700 border border-gray-700/50 transition-all duration-200" data-val="5">5K</button>
              <button class="quick-dist px-2.5 py-1 rounded-lg text-[10px] font-medium bg-gray-800 hover:bg-gray-700 border border-gray-700/50 transition-all duration-200" data-val="10">10K</button>
              <button class="quick-dist px-2.5 py-1 rounded-lg text-[10px] font-medium bg-gray-800 hover:bg-gray-700 border border-gray-700/50 transition-all duration-200" data-val="21.1">Half</button>
              <button class="quick-dist px-2.5 py-1 rounded-lg text-[10px] font-medium bg-gray-800 hover:bg-gray-700 border border-gray-700/50 transition-all duration-200" data-val="42.2">Full</button>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <div><label class="text-[10px] text-gray-500 mb-0.5 block">Date</label><input type="date" id="run-date" class="w-full bg-gray-800/80 rounded-lg px-2.5 py-1.5 text-xs border border-gray-700/50 focus:outline-none focus:border-emerald-500/50 transition"></div>
              <div><label class="text-[10px] text-gray-500 mb-0.5 block">Dist (km)</label><input type="number" step="0.1" id="run-distance" class="w-full bg-gray-800/80 rounded-lg px-2.5 py-1.5 text-xs border border-gray-700/50 focus:outline-none focus:border-emerald-500/50 transition placeholder:text-gray-600" placeholder="5"></div>
              <div><label class="text-[10px] text-gray-500 mb-0.5 block">Duration</label><input type="number" id="run-duration" class="w-full bg-gray-800/80 rounded-lg px-2.5 py-1.5 text-xs border border-gray-700/50 focus:outline-none focus:border-emerald-500/50 transition placeholder:text-gray-600" placeholder="30"></div>
              <div><label class="text-[10px] text-gray-500 mb-0.5 block">Rating</label><select id="run-rating" class="w-full bg-gray-800/80 rounded-lg px-2.5 py-1.5 text-xs border border-gray-700/50 focus:outline-none focus:border-emerald-500/50 transition"><option value="5">😊 Great</option><option value="4">🙂 Good</option><option value="3">😐 Okay</option><option value="2">😕 Tough</option><option value="1">😞 Terrible</option></select></div>
              <div><label class="text-[10px] text-gray-500 mb-0.5 block">Avg HR</label><input type="number" id="run-avg-hr" class="w-full bg-gray-800/80 rounded-lg px-2.5 py-1.5 text-xs border border-gray-700/50 focus:outline-none focus:border-emerald-500/50 transition placeholder:text-gray-600" placeholder="145"></div>
              <div><label class="text-[10px] text-gray-500 mb-0.5 block">Max HR</label><input type="number" id="run-max-hr" class="w-full bg-gray-800/80 rounded-lg px-2.5 py-1.5 text-xs border border-gray-700/50 focus:outline-none focus:border-emerald-500/50 transition placeholder:text-gray-600" placeholder="175"></div>
              <div><label class="text-[10px] text-gray-500 mb-0.5 block">Elev (m)</label><input type="number" step="1" id="run-elevation" class="w-full bg-gray-800/80 rounded-lg px-2.5 py-1.5 text-xs border border-gray-700/50 focus:outline-none focus:border-emerald-500/50 transition placeholder:text-gray-600" placeholder="50"></div>
              <div class="col-span-2"><label class="text-[10px] text-gray-500 mb-0.5 block">Notes</label><input type="text" id="run-notes" class="w-full bg-gray-800/80 rounded-lg px-2.5 py-1.5 text-xs border border-gray-700/50 focus:outline-none focus:border-emerald-500/50 transition placeholder:text-gray-600" placeholder="Felt great!"></div>
            </div>
            <button id="submit-run" class="mt-3 w-full py-2 bg-gradient-to-r from-emerald-700 to-emerald-600 hover:from-emerald-600 hover:to-emerald-500 rounded-lg text-xs font-semibold transition-all duration-200 active:scale-[0.98] shadow-lg shadow-emerald-900/20">Save Run</button>
          </div>

          <!-- History -->
          <div id="history-section" class="hidden bg-gray-900/60 rounded-xl border border-gray-800/30 p-4 animate-slide-down">
            <div class="flex items-center gap-2 mb-3"><span class="text-base">📋</span><h3 class="text-xs font-semibold text-gray-200">Run Log</h3></div>
            <div id="history-list" class="text-xs text-gray-400">No runs logged yet.</div>
          </div>

          <!-- Loading -->
          <div id="loading" class="text-center py-16 animate-fade-in">
            <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-gray-900 border border-gray-800 mb-3">
              <div class="animate-spin h-5 w-5 border-2 border-emerald-500 border-t-transparent rounded-full"></div>
            </div>
            <p class="text-gray-500 text-xs">Loading forecast...</p>
          </div>

          <!-- Forecast Cards -->
          <div id="days-container" class="space-y-2.5 hidden"></div>
        </div>

        <!-- RIGHT COLUMN: Chat always visible -->
        <div class="w-full lg:w-80 xl:w-96 flex-shrink-0">
          <div class="bg-gray-900/60 rounded-xl border border-gray-800/30 p-4 flex flex-col h-[calc(100vh-220px)] lg:sticky lg:top-4">
            <div class="flex items-center gap-2 mb-3">
              <span class="text-base">💬</span>
              <h3 class="text-xs font-semibold text-gray-200">AI Coach</h3>
            </div>
            <div id="chat-messages" class="flex-1 mb-3 space-y-2 overflow-y-auto scrollbar-thin text-xs">
              <div class="flex justify-start animate-fade-in-up">
                <div class="rounded-xl px-3.5 py-2.5 bg-gray-800/80 text-gray-300 max-w-[90%] leading-relaxed">
                  👋 Hi! I'm your AI running coach. Ask me about the forecast, which day is best, or what to wear.
                </div>
              </div>
            </div>
            <div class="flex gap-1.5 mb-3 flex-wrap">
              <button class="quick-chat px-2.5 py-1 rounded-lg text-[10px] bg-gray-800 hover:bg-gray-700 border border-gray-700/50 transition-all duration-200 text-gray-300" data-q="Is this week good for running?">This week good?</button>
              <button class="quick-chat px-2.5 py-1 rounded-lg text-[10px] bg-gray-800 hover:bg-gray-700 border border-gray-700/50 transition-all duration-200 text-gray-300" data-q="Which day is the best for a long run?">Best day?</button>
              <button class="quick-chat px-2.5 py-1 rounded-lg text-[10px] bg-gray-800 hover:bg-gray-700 border border-gray-700/50 transition-all duration-200 text-gray-300" data-q="What should I wear for running this week?">What to wear?</button>
            </div>
            <div class="flex gap-2">
              <input type="text" id="chat-input" class="flex-1 bg-gray-800/80 rounded-lg px-3 py-2 text-xs border border-gray-700/50 focus:outline-none focus:border-emerald-500/50 transition placeholder:text-gray-600" placeholder="Ask anything...">
              <button id="chat-send" class="px-3.5 py-2 bg-gradient-to-r from-emerald-700 to-emerald-600 hover:from-emerald-600 hover:to-emerald-500 rounded-lg text-xs font-medium transition-all duration-200 active:scale-[0.97]">Ask</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center pointer-events-none"></div>

  <script>
    const DEFAULT_LAT = {{ default_lat }};
    const DEFAULT_LON = {{ default_lon }};
    const DEFAULT_CITY = "{{ default_city }}";
    const MIN_RUNS = 20;

    let currentLat = DEFAULT_LAT;
    let currentLon = DEFAULT_LON;
    let currentPref = localStorage.getItem("paceclimate_time_pref") || "evening";

    function getToken() { return localStorage.getItem("paceclimate_token"); }

    // Toast notification
    function showToast(message, type) {
      var c = document.getElementById("toast-container");
      var t = document.createElement("div");
      var colors = { success: "bg-emerald-900/90 border-emerald-700 text-emerald-200", error: "bg-red-900/90 border-red-700 text-red-200", info: "bg-blue-900/90 border-blue-700 text-blue-200" };
      t.className = "pointer-events-auto px-5 py-3 rounded-xl border text-sm font-medium shadow-xl animate-slide-down " + (colors[type] || colors.info);
      t.textContent = message;
      c.appendChild(t);
      setTimeout(function() { t.style.opacity = "0"; t.style.transition = "opacity 0.3s"; setTimeout(function() { t.remove(); }, 300); }, 3000);
    }

    function apiFetch(url, options) {
      options = options || {};
      var token = getToken();
      if (!token) { showLogin(); return Promise.reject("no token"); }
      var headers = Object.assign({}, options.headers || {}, { "Authorization": "Bearer " + token });
      return fetch(url, Object.assign({}, options, { headers: headers })).then(async function(resp) {
        if (resp.status === 401) { showLogin(); throw new Error("unauthorized"); }
        return resp.json();
      });
    }

    function renderGoogleBtn() {
      var btn = document.querySelector(".g_id_signin");
      if (btn && window.google && google.accounts) {
        try { google.accounts.id.renderButton(btn, { type: "standard", shape: "pill", theme: "outline", size: "large", text: "signin_with", logo_alignment: "left" }); } catch(e) {}
      } else if (btn) {
        setTimeout(renderGoogleBtn, 500);
      }
    }

    function showLogin() {
      localStorage.removeItem("paceclimate_token");
      document.getElementById("dashboard").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
      setTimeout(renderGoogleBtn, 300);
    }

    function showDashboard(email) {
      email = email || "";
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
      document.getElementById("user-email").textContent = email;
      var avatar = document.getElementById("user-avatar");
      avatar.textContent = email ? email.charAt(0).toUpperCase() : "R";
    }

    // Init
    (function init() {
      var token = getToken();
      if (token) {
        apiFetch("/api/me").then(function(u) {
          showDashboard(u.email);
          document.getElementById("run-date").value = new Date().toISOString().split("T")[0];
          autoLocate();
        }).catch(function() { showLogin(); });
        return;
      }
      showLogin();
    })();

    var isLoginMode = true;

    function switchAuthTab(login) {
      isLoginMode = login;
      var t1 = document.getElementById("tab-login");
      var t2 = document.getElementById("tab-register");
      t1.className = "flex-1 py-2 text-sm font-medium rounded-lg " + (login ? "bg-emerald-600 text-white shadow-sm" : "text-gray-400 hover:text-white") + " transition-all duration-200";
      t2.className = "flex-1 py-2 text-sm font-medium rounded-lg " + (login ? "text-gray-400 hover:text-white" : "bg-emerald-600 text-white shadow-sm") + " transition-all duration-200";
      document.getElementById("auth-confirm").classList.toggle("hidden", login);
      document.getElementById("auth-btn").textContent = login ? "Sign In" : "Create Account";
      document.getElementById("auth-error").classList.add("hidden");
    }

    document.getElementById("tab-login").addEventListener("click", function() { switchAuthTab(true); });
    document.getElementById("tab-register").addEventListener("click", function() { switchAuthTab(false); });

    function onGoogleSignIn(response) {
      var el = document.getElementById("auth-error");
      fetch("/api/auth/google?credential=" + encodeURIComponent(response.credential), { method: "POST" })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          localStorage.setItem("paceclimate_token", data.token);
          showDashboard(data.email);
          document.getElementById("run-date").value = new Date().toISOString().split("T")[0];
          autoLocate();
        })
        .catch(function() {
          el.textContent = "Google sign-in failed.";
          el.classList.remove("hidden");
        });
    }

    document.getElementById("auth-btn").addEventListener("click", async function() {
      var email = document.getElementById("auth-email").value.trim();
      var password = document.getElementById("auth-password").value;
      var confirm = document.getElementById("auth-confirm").value;
      var error = document.getElementById("auth-error");
      error.classList.add("hidden");

      if (!email || !password) { error.textContent = "Please fill in all fields."; error.classList.remove("hidden"); return; }
      if (!isLoginMode && password !== confirm) { error.textContent = "Passwords do not match."; error.classList.remove("hidden"); return; }
      if (password.length < 4) { error.textContent = "Password must be at least 4 characters."; error.classList.remove("hidden"); return; }

      var btn = document.getElementById("auth-btn");
      btn.disabled = true;
      btn.textContent = "Please wait...";

      var endpoint = isLoginMode ? "/api/auth/login" : "/api/auth/register";
      try {
        var resp = await fetch(endpoint + "?email=" + encodeURIComponent(email) + "&password=" + encodeURIComponent(password), { method: "POST" });
        var data = await resp.json();
        if (!resp.ok) { throw new Error(data.detail || "Auth failed"); }
        localStorage.setItem("paceclimate_token", data.token);
        showDashboard(data.email);
        document.getElementById("run-date").value = new Date().toISOString().split("T")[0];
        autoLocate();
      } catch (err) {
        error.textContent = err.message;
        error.classList.remove("hidden");
      }
      btn.disabled = false;
      btn.textContent = isLoginMode ? "Sign In" : "Create Account";
    });

    document.getElementById("auth-password").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && isLoginMode) document.getElementById("auth-btn").click();
    });
    document.getElementById("auth-confirm").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !isLoginMode) document.getElementById("auth-btn").click();
    });

    // Logout
    document.getElementById("logout-btn").addEventListener("click", function() { showLogin(); });

    // Stats
    function updateStats(runCount) {
      var bar = document.getElementById("stats-bar");
      if (runCount < MIN_RUNS) {
        bar.textContent = "Log " + (MIN_RUNS - runCount) + " more runs to unlock AI scoring (" + runCount + "/" + MIN_RUNS + ")";
        bar.className = "mt-2 text-sm text-yellow-500/80";
      } else {
        bar.textContent = "AI is learning from your " + runCount + " logged runs";
        bar.className = "mt-2 text-sm text-emerald-400/80";
      }
    }

    // Quick distance presets
    document.querySelectorAll(".quick-dist").forEach(function(btn) {
      btn.addEventListener("click", function() {
        document.getElementById("run-distance").value = btn.dataset.val;
      });
    });

    // Quick chat questions
    document.querySelectorAll(".quick-chat").forEach(function(btn) {
      btn.addEventListener("click", function() {
        document.getElementById("chat-input").value = btn.dataset.q;
        document.getElementById("chat-send").click();
      });
    });

    document.getElementById("log-run-toggle").addEventListener("click", function() {
      document.getElementById("log-run-form").classList.toggle("hidden");
    });

    document.getElementById("history-toggle").addEventListener("click", function() {
      var section = document.getElementById("history-section");
      section.classList.toggle("hidden");
      if (!section.classList.contains("hidden")) loadHistory();
    });

    document.getElementById("submit-run").addEventListener("click", async function() {
      var date = document.getElementById("run-date").value;
      var distance = document.getElementById("run-distance").value;
      var duration = document.getElementById("run-duration").value;
      var rating = document.getElementById("run-rating").value;
      var avgHr = document.getElementById("run-avg-hr").value;
      var maxHr = document.getElementById("run-max-hr").value;
      var elevation = document.getElementById("run-elevation").value;
      var notes = document.getElementById("run-notes").value;

      if (!distance || !duration) {
        showToast("Please enter distance and duration.", "error");
        return;
      }

      try {
        var url = "/api/runs?date=" + date + "&distance_km=" + distance + "&duration_min=" + duration + "&rating=" + rating + "&lat=" + currentLat + "&lon=" + currentLon;
        if (avgHr) url += "&avg_hr=" + avgHr;
        if (maxHr) url += "&max_hr=" + maxHr;
        if (elevation) url += "&elevation_gain=" + elevation;
        if (notes) url += "&notes=" + encodeURIComponent(notes);
        var data = await apiFetch(url, { method: "POST" });
        if (!data) return;
        showToast("Run saved! (" + data.run_count + " total)" + (data.model_trained ? " AI retrained!" : ""), "success");
        updateStats(data.run_count);
        document.getElementById("run-distance").value = "";
        document.getElementById("run-duration").value = "";
        document.getElementById("run-avg-hr").value = "";
        document.getElementById("run-max-hr").value = "";
        document.getElementById("run-elevation").value = "";
        document.getElementById("run-notes").value = "";
        loadAverages();
        fetchForecast();
      } catch (err) {
        showToast("Failed to save run.", "error");
      }
    });

    async function loadHistory() {
      var list = document.getElementById("history-list");
      try {
        var data = await apiFetch("/api/runs");
        if (!data || data.runs.length === 0) { list.innerHTML = "<div class='text-center py-6 text-gray-500'>No runs logged yet.</div>"; return; }
        list.innerHTML = data.runs.map(function(r) {
          var emoji = ["😞","😕","😐","🙂","😊"][r.rating - 1] || "❓";
          var pace = (r.duration_min / r.distance_km).toFixed(1);
          return '<div class="flex items-center justify-between py-3 border-b border-gray-800/50 last:border-0 animate-fade-in-up">' +
            '<div class="flex items-center gap-3">' +
              '<span class="text-lg">' + emoji + '</span>' +
              '<div>' +
                '<div class="text-sm font-medium text-gray-200">' + r.date + '</div>' +
                '<div class="text-xs text-gray-500">' + r.distance_km + ' km &middot; ' + pace + ' min/km' + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="text-right">' +
              '<div class="text-sm text-gray-300">' + r.duration_min + ' min</div>' +
              (r.notes ? '<div class="text-xs text-gray-500">' + r.notes + '</div>' : '') +
            '</div>' +
          '</div>';
        }).join("");
      } catch (err) { list.innerHTML = "<div class='text-center py-6 text-red-400'>Failed to load history.</div>"; }
    }

    function addChatMessage(text, isUser) {
      var container = document.getElementById("chat-messages");
      container.classList.remove("hidden");
      var div = document.createElement("div");
      div.className = "flex " + (isUser ? "justify-end" : "justify-start") + " animate-fade-in-up";
      div.innerHTML = '<div class="rounded-xl px-4 py-2.5 text-sm max-w-[80%] ' + (isUser ? "bg-emerald-800/80 text-emerald-100" : "bg-gray-800/80 text-gray-200") + '">' + text + '</div>';
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    document.getElementById("chat-send").addEventListener("click", async function() {
      var input = document.getElementById("chat-input");
      var q = input.value.trim();
      if (!q) return;
      input.value = "";
      addChatMessage(q, true);
      var thinking = document.createElement("div");
      thinking.className = "flex justify-start";
      thinking.id = "chat-thinking";
      thinking.innerHTML = '<div class="rounded-xl px-4 py-2.5 text-sm bg-gray-800/80 text-gray-400 italic"><span class="inline-block w-2 h-2 bg-emerald-500 rounded-full animate-pulse mr-1"></span> Thinking...</div>';
      document.getElementById("chat-messages").appendChild(thinking);
      try {
        var data = await apiFetch("/api/chat?q=" + encodeURIComponent(q) + "&lat=" + currentLat + "&lon=" + currentLon);
        document.getElementById("chat-thinking").remove();
        addChatMessage(data && data.answer ? data.answer : "No answer.");
      } catch {
        document.getElementById("chat-thinking").remove();
        addChatMessage("Sorry, I couldn't answer that.");
      }
    });
    document.getElementById("chat-input").addEventListener("keydown", function(e) {
      if (e.key === "Enter") document.getElementById("chat-send").click();
    });

    function setActivePref(pref) {
      document.querySelectorAll(".time-btn").forEach(function(btn) {
        btn.classList.remove("bg-emerald-600", "text-white", "shadow-sm");
        btn.classList.add("text-gray-400");
      });
      var active = document.querySelector('.time-btn[data-pref="' + pref + '"]');
      if (active) {
        active.classList.remove("text-gray-400");
        active.classList.add("bg-emerald-600", "text-white", "shadow-sm");
      }
      currentPref = pref;
      localStorage.setItem("paceclimate_time_pref", pref);
      fetchForecast();
    }

    document.querySelectorAll(".time-btn").forEach(function(btn) {
      btn.addEventListener("click", function() { setActivePref(btn.dataset.pref); });
    });
    setActivePref(currentPref);

    function weatherIcon(code) {
      if (code === 0) return "☀️";
      if (code <= 2) return "⛅";
      if (code === 3) return "☁️";
      if (code === 45 || code === 48) return "🌫️";
      if (code >= 51 && code <= 57) return "🌦️";
      if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return "🌧️";
      if (code >= 71 && code <= 77) return "❄️";
      if (code >= 85 && code <= 86) return "🌨️";
      if (code >= 95) return "⛈️";
      return "🌤️";
    }

    function scoreColor(score) {
      if (score >= 80) return "from-emerald-900/40 to-emerald-900/20 border-emerald-700/50";
      if (score >= 60) return "from-yellow-900/30 to-yellow-900/10 border-yellow-700/50";
      if (score >= 40) return "from-orange-900/30 to-orange-900/10 border-orange-700/50";
      return "from-red-900/30 to-red-900/10 border-red-700/50";
    }

    function scoreBadge(label) {
      var colors = { Great: "bg-emerald-600", Good: "bg-yellow-600", Okay: "bg-orange-600", Skip: "bg-red-600" };
      return '<span class="text-xs font-bold px-2 py-0.5 rounded-full ' + (colors[label] || "bg-gray-600") + '">' + label + '</span>';
    }

    function formatDate(dateStr) {
      var d = new Date(dateStr + "T12:00:00");
      return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    }

    function renderDays(days) {
      var container = document.getElementById("days-container");
      container.innerHTML = "";
      days.forEach(function(day, idx) {
        var card = document.createElement("div");
        card.className = "rounded-2xl border p-5 transition-all duration-300 hover:scale-[1.01] hover:shadow-xl bg-gradient-to-br " + scoreColor(day.score) + " animate-fade-in-up delay-" + Math.min(idx + 1, 7);
        var rank = idx + 1;
        var pct = Math.min(day.score, 100);
        var circumference = 2 * Math.PI * 28;
        var offset = circumference - (pct / 100) * circumference;

        card.innerHTML =
          '<div class="flex items-start justify-between">' +
            '<div class="flex-1">' +
              '<div class="flex items-center gap-2 mb-1">' +
                '<span class="text-lg font-bold text-gray-300">#' + rank + '</span>' +
                '<span class="font-semibold text-base text-gray-100">' + formatDate(day.date) + '</span>' +
                scoreBadge(day.label) +
              '</div>' +
              '<div class="flex items-center gap-3 mt-3">' +
                '<span class="text-4xl">' + weatherIcon(day.weather_code) + '</span>' +
                '<div>' +
                  '<div class="text-sm font-medium text-gray-200">' + day.weather_desc + '</div>' +
                  '<div class="flex gap-4 mt-1 text-xs text-gray-400">' +
                    '<span>🌡️ ' + day.temp_used + '°C</span>' +
                    '<span>💧 ' + day.precip_prob + '%</span>' +
                    '<span>💨 ' + day.wind_max + ' km/h</span>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="relative flex-shrink-0 ml-4">' +
              '<svg width="72" height="72" viewBox="0 0 72 72" class="transform -rotate-90">' +
                '<circle cx="36" cy="36" r="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>' +
                '<circle cx="36" cy="36" r="28" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '" stroke-linecap="round" class="score-ring text-emerald-400"/>' +
              '</svg>' +
              '<div class="absolute inset-0 flex items-center justify-center">' +
                '<span class="text-lg font-bold text-white">' + day.score + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<button class="explain-btn mt-3 text-xs text-emerald-400/70 hover:text-emerald-300 transition-all duration-200 flex items-center gap-1" data-idx="' + idx + '">' +
            '<span>Why this score?</span>' +
            '<span class="text-xs transform transition-transform duration-200">▼</span>' +
          '</button>' +
          '<div id="explain-' + idx + '" class="hidden mt-2 text-sm text-gray-400 bg-black/20 rounded-xl p-4 leading-relaxed">' + day.explanation + '</div>';

        container.appendChild(card);
      });

      document.querySelectorAll(".explain-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var idx = btn.dataset.idx;
          var box = document.getElementById("explain-" + idx);
          var isHidden = box.classList.contains("hidden");
          box.classList.toggle("hidden");
          btn.querySelector("span:last-child").textContent = isHidden ? "▲" : "▼";
        });
      });
    }

    async function fetchForecast() {
      var container = document.getElementById("days-container");
      var loading = document.getElementById("loading");
      loading.classList.remove("hidden");
      container.classList.add("hidden");
      try {
        var url = "/api/forecast?lat=" + currentLat + "&lon=" + currentLon + "&time_pref=" + currentPref;
        var planDist = document.getElementById("plan-dist").value;
        var planDur = document.getElementById("plan-dur").value;
        if (planDist) url += "&planned_distance=" + planDist;
        if (planDur) url += "&planned_duration=" + planDur;
        var data = await apiFetch(url);
        if (!data) return;
        renderDays(data.days);
        loading.classList.add("hidden");
        container.classList.remove("hidden");
        if (data.run_count !== undefined) updateStats(data.run_count);
        if (data.run_count >= MIN_RUNS) document.getElementById("effort-bar").classList.remove("hidden");
      } catch {
        loading.innerHTML = '<div class="text-center py-10"><p class="text-red-400">Failed to load forecast.</p><button onclick="fetchForecast()" class="mt-3 px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm transition">Retry</button></div>';
      }
    }

    async function loadAverages() {
      try {
        var data = await apiFetch("/api/averages");
        if (!data) return;
        document.getElementById("plan-dist").placeholder = data.distance_km + " km";
        document.getElementById("plan-dur").placeholder = data.duration_min + " min";
        document.getElementById("plan-pace").placeholder = data.pace + " min/km";
      } catch {}
    }

    document.getElementById("plan-dist").addEventListener("input", function() {
      var d = parseFloat(document.getElementById("plan-dist").value);
      var dur = parseFloat(document.getElementById("plan-dur").value);
      if (d > 0 && dur > 0) document.getElementById("plan-pace").value = (dur / d).toFixed(1);
      else document.getElementById("plan-pace").value = "";
    });
    document.getElementById("plan-dur").addEventListener("input", function() {
      var d = parseFloat(document.getElementById("plan-dist").value);
      var dur = parseFloat(document.getElementById("plan-dur").value);
      if (d > 0 && dur > 0) document.getElementById("plan-pace").value = (dur / d).toFixed(1);
      else document.getElementById("plan-pace").value = "";
    });
    document.getElementById("plan-update").addEventListener("click", fetchForecast);
    document.getElementById("plan-reset").addEventListener("click", function() {
      document.getElementById("plan-dist").value = "";
      document.getElementById("plan-dur").value = "";
      document.getElementById("plan-pace").value = "";
      fetchForecast();
    });

    function autoLocate() {
      loadAverages();
      if (!navigator.geolocation) { fetchForecast(); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          currentLat = pos.coords.latitude;
          currentLon = pos.coords.longitude;
          document.getElementById("city-display").textContent = currentLat.toFixed(2) + "°N, " + currentLon.toFixed(2) + "°E";
          fetchForecast();
        },
        function() { fetchForecast(); },
        { enableHighAccuracy: true, timeout: 5000 }
      );
    }
  </script>
</body>
</html>
